# ---------- Base de datos (PostgreSQL) ----------
# El esquema se crea con database/fleetcontrol_schema.sql, por eso ddl-auto=none
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleetcontrol}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- Seguridad ----------
# Cambiar JWT_SECRET en producción (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
app.jwt.expiration-minutes=480
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ---------- Usuario administrador inicial (solo si la tabla usuarios está vacía) ----------
app.seed.admin-email=${ADMIN_EMAIL:admin@fleetcontrol.local}
app.seed.admin-password=${ADMIN_PASSWORD:Admin123*}

# ---------- Comprobantes ----------
app.storage.dir=${STORAGE_DIR:./storage/comprobantes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=${PORT:8080}
