# Blueprint de Render: crea la base de datos, el backend y el frontend de una vez.
databases:
  - name: fleetcontrol-db
    plan: free
    databaseName: fleetcontrol
    user: fleetcontrol_user
    region: oregon

services:
  - type: web
    name: fleetcontrol-api
    runtime: docker
    rootDir: backend
    plan: free
    region: oregon
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: fleetcontrol-web
    runtime: static
    rootDir: Interfaz
    staticPublishPath: .
